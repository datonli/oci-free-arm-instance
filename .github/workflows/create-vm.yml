name: Try to Create OCI VM
# It will run every 5 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  # 【精准填入】：填入刚才拿到的、100% 正确且有效的凤凰城官方 Ubuntu ARM 镜像 ID
  IMAGE_ID: "ocid1.image.oc1.phx.aaaaaaaaufk34i3h6pc66mifse3yqpstkdbbohmlgpry7gu2ew6fq7faf5pa"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: "us-phoenix-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  SUPPRESS_LABEL_WARNING: "True"
  PYTHONWARNINGS: "ignore" # 【彻底静音】：强制忽略 Python 的 urllib3 警告，净化日志

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        run: |
          set -o pipefail

          pip install oci-cli

          rm -rf ~/.oci
          mkdir -p ~/.oci

          # 1. 生成私钥文件
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > /home/runner/oci_api_key.pem
          chmod 600 /home/runner/oci_api_key.pem

          # 2. 导出环境变量
          export OCI_CLI_KEY_FILE="/home/runner/oci_api_key.pem"
          
          CLEAN_COMPARTMENT=$(echo "$COMPARTMENT_ID" | xargs)
          CLEAN_SUBNET=$(echo "$SUBNET_ID" | xargs)

          # 准备环境文件
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub
          echo '{"ocpus": 1, "memoryInGBs": 6}' > /home/runner/shape_config.json

          # 3. 运行三路可用区轮询创建命令
          ALL_OUTPUTS=""
          SUCCESS_FLAG=0

          for AD in "TbLZ:PHX-AD-1" "TbLZ:PHX-AD-2" "TbLZ:PHX-AD-3"
          do
            echo "正在尝试在可用区 [ $AD ] 创建实例..."
            
            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$CLEAN_COMPARTMENT" \
              --availability-domain "$AD" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "file:///home/runner/shape_config.json" \
              --subnet-id "$CLEAN_SUBNET" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 200 2>&1 || true)
            
            # 清洗单次输出中的换行和警告
            ALL_OUTPUTS="$ALL_OUTPUTS\n\n【可用区 $AD 尝试结果】:\n$OCI_OUTPUT"

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "恭喜！在 $AD 成功创建实例！"
              SUCCESS_FLAG=1
              break
            elif echo "$OCI_OUTPUT" | grep -q 'Out of host capacity'; then
              echo "$AD 目前暂时缺货 (Out of host capacity)"
              SUCCESS_FLAG=2
            fi
          done

          # Store the log as a GitHub step output
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ALL_OUTPUTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ $SUCCESS_FLAG -eq 1 ]; then
            exit 0
          elif [ $SUCCESS_FLAG -eq 2 ]; then
            echo "所有可用区参数与认证完美通过！目前仅因甲骨文官方机房缺货导致拒绝。正在等待定时任务自动重试。"
            exit 1
          else
            echo "未能成功创建，请检查输出日志。"
            exit 1
          fi

      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "OCI VM Status: ${{ steps.create_vm.outcome }}"
          status: ${{ steps.create_vm.outcome }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0xdc3545' }}
          description: "Attempt to create A1.Flex VM. Status: ${{ steps.create_vm.outcome }}\n\nLog Output:\n${{ steps.create_vm.outputs.log_data }}"
