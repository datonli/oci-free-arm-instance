name: Try to Create OCI VM
# It will run every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.phx.aaaaaaaaoz6w5a2sklyrggym5epwdfjsh7itp3qgpxqntorjgrj5v25jfy6q"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "TbLZ:PHX-AD-2"
  OCI_CLI_REGION: "us-phoenix-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        # 去掉 continue-on-error，让它直接在这步死掉并暴露出具体的 Debug 报错
        run: |
          set -o pipefail

          pip install oci-cli

          rm -rf ~/.oci
          mkdir -p ~/.oci

          # 1. 生成私钥文件
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > /home/runner/oci_api_key.pem
          chmod 600 /home/runner/oci_api_key.pem

          # 2. 告诉 OCI CLI 密钥路径
          export OCI_CLI_KEY_FILE="/home/runner/oci_api_key.pem"
          
          # 准备 SSH 公钥
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          # 3. 直接运行命令，让 Debug 日志直接刷在控制台界面上
          oci compute instance launch \
            --debug \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 200
